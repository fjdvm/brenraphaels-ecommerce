name: Auto-complete Resolved Tickets

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-complete-tickets
  cancel-in-progress: false

jobs:
  auto-complete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Auto-complete Resolved Tickets
        env:
          STOREFRONT_URL: ${{ vars.STOREFRONT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$STOREFRONT_URL" ]; then echo "::error::STOREFRONT_URL repository variable is not set"; exit 1; fi
          if [ -z "$CRON_SECRET" ]; then echo "::error::CRON_SECRET repository secret is not set"; exit 1; fi
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 300 \
            --retry 2 --retry-delay 10 --retry-all-errors \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${STOREFRONT_URL%/}/api/cron/auto-complete-tickets"
