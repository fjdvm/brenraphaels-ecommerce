name: Customer Notification retries

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-notifications
  cancel-in-progress: false

jobs:
  retry-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retry pending Customer Notifications
        env:
          STOREFRONT_URL: ${{ vars.STOREFRONT_URL }}
          CUSTOMER_NOTIFICATION_CRON_SECRET: ${{ secrets.CUSTOMER_NOTIFICATION_CRON_SECRET }}
        run: |
          test -n "$STOREFRONT_URL"
          test -n "$CUSTOMER_NOTIFICATION_CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 90 \
            --retry 2 --retry-delay 10 --retry-all-errors \
            --header "Authorization: Bearer $CUSTOMER_NOTIFICATION_CRON_SECRET" \
            "${STOREFRONT_URL%/}/api/cron/customer-notifications"
