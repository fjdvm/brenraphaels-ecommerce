name: Storefront container
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          classification=code
          if [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = push ]; then
            base="$BASE_SHA"
            if [ "$EVENT_NAME" = pull_request ]; then
              base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
            fi
            # New branches have no before commit; fail safe to full checks.
            if [ "$base" != 0000000000000000000000000000000000000000 ]; then
              # Include both sides of renames and deleted files; preserve unusual filenames.
              git diff --name-only --no-renames -z "$base" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
              mapfile -d '' -t changed_paths < "$RUNNER_TEMP/changed-paths"
              classification=$(node scripts/ci/classify-changes.mjs "${changed_paths[@]}")
            fi
          fi
          echo "classification=$classification" >> "$GITHUB_OUTPUT"
          echo "Change classification: $classification" >> "$GITHUB_STEP_SUMMARY"

  checks:
    needs: changes
    if: needs.changes.outputs.classification == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test -- --maxWorkers=2

  container-smoke:
    needs: changes
    if: needs.changes.outputs.classification == 'code' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@v3
      - name: Restore Next.js build cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/next-build-cache
          key: ${{ runner.os }}-ecommerce-next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ecommerce-next-${{ hashFiles('package-lock.json') }}-
      - name: Inject Next.js cache mount
        uses: reproducible-containers/buildkit-cache-dance@ca04d1a0e0018e28a060ec9f87518ddc453b4460 # v3.3.0
        with:
          cache-map: '{"${{ runner.temp }}/next-build-cache": "/app/.next/cache"}'
          scratch-dir: ${{ runner.temp }}/cache-dance
          skip-extraction: true
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: storefront:smoke
          # PRs only read the dependency cache published by main.
          cache-from: type=gha,scope=ecommerce-production
      - name: Record and limit uncompressed image size
        run: |
          bytes=$(docker image inspect storefront:smoke --format '{{.Size}}')
          echo "Storefront image: $bytes bytes (limit 400 MiB)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$bytes" -lt 419430400
      - name: Smoke test against disposable PostgreSQL
        run: bash scripts/container/run.sh

  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, checks, container-smoke, production-image]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every check to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CLASSIFICATION: ${{ needs.changes.outputs.classification }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          CONTAINER_RESULT: ${{ needs.container-smoke.result }}
          IMAGE_RESULT: ${{ needs.production-image.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          case "$CLASSIFICATION" in
            docs-only)
              test "$CHECKS_RESULT" = skipped
              test "$CONTAINER_RESULT" = skipped
              test "$IMAGE_RESULT" = skipped
              ;;
            code)
              test "$CHECKS_RESULT" = success
              if [ "$EVENT_NAME" = push ]; then
                test "$CONTAINER_RESULT" = skipped
                test "$IMAGE_RESULT" = success
              else
                test "$CONTAINER_RESULT" = success
                test "$IMAGE_RESULT" = skipped
              fi
              ;;
            *) exit 1 ;;
          esac

  production-image:
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.classification == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Extract before saving in post steps after a successful main build.
      # PR jobs use restore-only above; Docker cache still publishes after deploy.
      - name: Cache Next.js build data
        id: next-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/next-build-cache
          key: ${{ runner.os }}-ecommerce-next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ecommerce-next-${{ hashFiles('package-lock.json') }}-
      - name: Persist Next.js cache mount
        uses: reproducible-containers/buildkit-cache-dance@ca04d1a0e0018e28a060ec9f87518ddc453b4460 # v3.3.0
        with:
          cache-map: '{"${{ runner.temp }}/next-build-cache": "/app/.next/cache"}'
          scratch-dir: ${{ runner.temp }}/cache-dance
          skip-extraction: ${{ steps.next-cache.outputs.cache-hit == 'true' }}
      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish production image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=ecommerce-production

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.classification == 'code'
    needs: [changes, checks, production-image, ci-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: ecommerce-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: rg-brenraphaels
      CONTAINER_APP: ca-ecommerce
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy and verify Storefront revision
        shell: bash
        env:
          DEPLOY_SECRETS: ${{ toJSON(secrets) }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          STOREFRONT_IMAGE: ${{ needs.production-image.outputs.image }}
        run: bash scripts/deploy/deploy.sh
      - uses: docker/setup-buildx-action@v3
      # Export the dependency target, not the runtime image: mode=min on the
      # runtime target would omit npm ci, because dependencies is an intermediate stage.
      - name: Publish dependency cache after deploy
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dependencies
          cache-from: type=gha,scope=ecommerce-production
          cache-to: type=gha,mode=min,scope=ecommerce-production
