name: Storefront container
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run lint
      - run: npm test -- --maxWorkers=2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: storefront:smoke
          build-args: NEXT_PUBLIC_SITE_URL=http://localhost:3000
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record and limit uncompressed image size
        run: |
          bytes=$(docker image inspect storefront:smoke --format '{{.Size}}')
          echo "Storefront image: $bytes bytes (limit 400 MiB)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$bytes" -lt 419430400
      - name: Smoke test production container
        run: bash scripts/container/run.sh
