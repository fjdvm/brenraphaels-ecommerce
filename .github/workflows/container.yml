name: Storefront container
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run lint
      - run: npm test -- --maxWorkers=2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: storefront:smoke
          build-args: NEXT_PUBLIC_SITE_URL=http://localhost:3000
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record and limit uncompressed image size
        run: |
          bytes=$(docker image inspect storefront:smoke --format '{{.Size}}')
          echo "Storefront image: $bytes bytes (limit 400 MiB)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$bytes" -lt 419430400
      - name: Smoke test production container
        run: bash scripts/container/run.sh

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: ecommerce-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      RESOURCE_GROUP: rg-brenraphaels
      CONTAINER_APP: ca-ecommerce
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish production image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: NEXT_PUBLIC_SITE_URL=https://shop.buildwrite.me
          cache-from: type=gha,scope=ecommerce-production
          cache-to: type=gha,mode=max,scope=ecommerce-production
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy and verify Storefront revision
        shell: bash
        env:
          DEPLOY_SECRETS: ${{ toJSON(secrets) }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          STOREFRONT_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: bash scripts/deploy/deploy.sh
